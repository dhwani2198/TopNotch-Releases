        <g fill="#eeeef1" font-size="12" font-weight="620"><text x="590" y="269">Work Calendar · Apple</text><text x="895" y="269">Google Meet</text><text x="590" y="329">Meeting</text><text x="895" y="329">Client</text><text x="518" y="389">Sep 9, 1:00 PM</text><text x="770" y="389">30 min</text></g>
