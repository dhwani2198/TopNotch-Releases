<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Scheduling from TopNotch on a MacBook</title>
  <desc id="desc">Full MacBook product mockup showing the TopNotch scheduling screen expanded directly from the physical display notch.</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e17"/><stop offset=".54" stop-color="#151a23"/><stop offset="1" stop-color="#040608"/></linearGradient>
    <radialGradient id="ambient" cx="52%" cy="23%" r="66%"><stop stop-color="#168ff4" stop-opacity=".22"/><stop offset="1" stop-color="#168ff4" stop-opacity="0"/></radialGradient>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#113858"/><stop offset=".4" stop-color="#197d99"/><stop offset=".72" stop-color="#234477"/><stop offset="1" stop-color="#11182c"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8eaed"/><stop offset=".18" stop-color="#adb2b9"/><stop offset="1" stop-color="#4c5056"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfe2e6"/><stop offset=".24" stop-color="#9da2a9"/><stop offset="1" stop-color="#3f4349"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#168ff4"/><stop offset="1" stop-color="#2879ea"/></linearGradient>
    <clipPath id="screenClip"><rect x="174" y="102" width="1252" height="690" rx="17"/></clipPath>
    <filter id="deviceShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dy="28" stdDeviation="35" flood-color="#000" flood-opacity=".72"/></filter>
    <filter id="panelShadow" x="-25%" y="-20%" width="150%" height="165%"><feDropShadow dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".66"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#scene)"/><rect width="1600" height="1000" fill="url(#ambient)"/>
  <ellipse cx="800" cy="935" rx="650" ry="35" fill="#000" opacity=".65" filter="url(#blur)"/>
