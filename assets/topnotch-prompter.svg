<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TopNotch Prompter on a MacBook</title>
  <desc id="desc">Figma-style MacBook render showing a video meeting with the real TopNotch liquid-glass Prompter floating over the screen.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111d"/><stop offset=".48" stop-color="#111a27"/><stop offset="1" stop-color="#03060a"/></linearGradient>
    <radialGradient id="ambient" cx="70%" cy="18%" r="72%"><stop stop-color="#168ff4" stop-opacity=".27"/><stop offset="1" stop-color="#168ff4" stop-opacity="0"/></radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26282d"/><stop offset=".08" stop-color="#101114"/><stop offset="1" stop-color="#050506"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e1e4e8"/><stop offset=".38" stop-color="#989da4"/><stop offset="1" stop-color="#454950"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9bec5"/><stop offset=".34" stop-color="#777c83"/><stop offset="1" stop-color="#31343a"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142234"/><stop offset=".55" stop-color="#0d1825"/><stop offset="1" stop-color="#070b12"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcecff" stop-opacity=".38"/><stop offset=".44" stop-color="#8ea1bb" stop-opacity=".20"/><stop offset="1" stop-color="#667b98" stop-opacity=".32"/></linearGradient>
    <linearGradient id="personA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cc9a82"/><stop offset=".5" stop-color="#45536d"/><stop offset="1" stop-color="#18202c"/></linearGradient>
    <linearGradient id="personB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2b29b"/><stop offset=".52" stop-color="#6b584f"/><stop offset="1" stop-color="#1b1f28"/></linearGradient>
    <clipPath id="screenClip"><rect x="130" y="77" width="940" height="510" rx="10"/></clipPath>
    <filter id="deviceShadow" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dy="24" stdDeviation="26" flood-color="#000" flood-opacity=".68"/></filter>
    <filter id="panelShadow" x="-40%" y="-35%" width="180%" height="190%"><feDropShadow dy="17" stdDeviation="22" flood-color="#000" flood-opacity=".62"/></filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>

  <rect width="1200" height="720" fill="url(#canvas)"/>
  <ellipse cx="765" cy="145" rx="330" ry="230" fill="url(#ambient)" filter="url(#softBlur)"/>
  <ellipse cx="600" cy="671" rx="500" ry="27" fill="#000" opacity=".68" filter="url(#softBlur)"/>

  <g filter="url(#deviceShadow)">
    <rect x="92" y="38" width="1016" height="586" rx="32" fill="url(#metal)"/>
    <rect x="104" y="50" width="992" height="562" rx="24" fill="url(#bezel)"/>
    <circle cx="600" cy="63" r="3.2" fill="#263342"/><circle cx="600" cy="63" r="1.2" fill="#79b9df" opacity=".52"/>

    <g clip-path="url(#screenClip)">
      <rect x="130" y="77" width="940" height="510" fill="url(#screen)"/>
      <circle cx="920" cy="150" r="260" fill="#168ff4" opacity=".11"/>
      <circle cx="208" cy="544" r="255" fill="#8d62ff" opacity=".08"/>
      <rect x="130" y="77" width="940" height="32" fill="#080b10" fill-opacity=".88"/>
      <text x="152" y="98" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700">Zoom Meeting</text>
      <g fill="#dfe4eb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" text-anchor="end"><text x="1036" y="98">Tue Sep 8   12:36 PM</text></g>

      <g opacity=".9">
        <rect x="153" y="132" width="411" height="198" rx="13" fill="url(#personA)"/>
        <circle cx="365" cy="208" r="42" fill="#bd8976"/><path d="M318 303c8-52 33-76 68-76s62 24 72 76" fill="#29394e"/>
        <path d="M325 196c4-55 77-71 91-5-23-23-62-27-91 5Z" fill="#352b28"/>
        <rect x="169" y="296" width="89" height="23" rx="8" fill="#090b0f" fill-opacity=".65"/><text x="183" y="312" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">Maya Chen</text>

        <rect x="579" y="132" width="238" height="198" rx="13" fill="url(#personB)"/>
        <circle cx="698" cy="207" r="38" fill="#c99d84"/><path d="M648 302c12-51 33-72 53-72s48 20 57 72" fill="#6c4f52"/>
        <path d="M661 194c10-49 72-59 80 5-22-23-50-25-80-5Z" fill="#272126"/>
        <rect x="595" y="296" width="73" height="23" rx="8" fill="#090b0f" fill-opacity=".65"/><text x="607" y="312" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">Priya S.</text>

        <rect x="153" y="344" width="238" height="184" rx="13" fill="#29384d"/>
        <circle cx="272" cy="414" r="36" fill="#c59a7e"/><path d="M222 509c9-48 31-70 51-70s45 20 56 70" fill="#46556b"/>
        <rect x="169" y="494" width="87" height="23" rx="8" fill="#090b0f" fill-opacity=".65"/><text x="181" y="510" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">Alex Morgan</text>

        <rect x="406" y="344" width="158" height="184" rx="13" fill="#1a2635"/>
        <circle cx="485" cy="424" r="42" fill="#168ff4"/><text x="485" y="435" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31" font-weight="750" text-anchor="middle">TN</text>
      </g>

      <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#e9edf2">
        <rect x="153" y="544" width="411" height="30" rx="10" fill="#090c11" fill-opacity=".86"/>
        <circle cx="182" cy="559" r="8" fill="#27303c"/><text x="210" y="563" font-size="11">Mute</text>
        <circle cx="268" cy="559" r="8" fill="#27303c"/><text x="296" y="563" font-size="11">Video</text>
        <circle cx="360" cy="559" r="8" fill="#168ff4"/><text x="388" y="563" font-size="11">Share</text>
        <rect x="498" y="550" width="52" height="19" rx="7" fill="#d84a4a"/><text x="524" y="563" font-size="10" text-anchor="middle">Leave</text>
      </g>

      <g filter="url(#panelShadow)">
        <rect x="598" y="156" width="430" height="346" rx="23" fill="#2c3949" fill-opacity=".72"/>
        <rect x="598.8" y="156.8" width="428.4" height="344.4" rx="22.2" fill="url(#glass)" stroke="#f3f7ff" stroke-opacity=".38" stroke-width="1.6"/>
        <path d="M621 156.8h384c12 0 22 10 22 22v53H599v-53c0-12 10-22 22-22Z" fill="#eef6ff" fill-opacity=".055"/>
        <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
          <g transform="translate(624 180)" fill="none" stroke="#fff" stroke-width="1.9"><path d="M2 3h18v13H9l-5 4v-4H2Z" fill="#fff" fill-opacity=".18"/><path d="M7 8h8M7 12h5"/></g>
          <text x="657" y="198" fill="#fff" font-size="18" font-weight="700">Prompter</text>
          <g transform="translate(944 180)" stroke="#fff" stroke-width="1.8" fill="none"><path d="M8 2v13M3 10l5 5 5-5M2 19h13"/></g>
          <path d="M994 183l13 13m0-13-13 13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>

          <rect x="620" y="223" width="386" height="219" rx="14" fill="#05090f" fill-opacity=".27" stroke="#fff" stroke-opacity=".06"/>
          <text x="643" y="258" fill="#fff" font-size="17" font-weight="700">Design review</text>
          <g fill="#f3f6fa" font-size="15"><text x="643" y="298">•  Confirm the rollout timeline</text><text x="643" y="331">•  Ask for feedback on the new flow</text><text x="643" y="364">•  Share owners and next steps</text></g>
          <line x1="643" y1="393" x2="979" y2="393" stroke="#fff" stroke-opacity=".09"/>
          <text x="643" y="422" fill="#c8d3e0" font-size="13">Add another talking point…</text>
          <text x="620" y="474" fill="#e4eaf2" fill-opacity=".76" font-size="12">Autosaved in TopNotch</text>
          <text x="973" y="474" fill="#fff" font-size="13" font-weight="700" text-anchor="end">New</text>
        </g>
      </g>
    </g>

    <path d="M72 620h1056l-76 54c-10 7-22 11-35 11H183c-13 0-25-4-35-11Z" fill="url(#base)"/>
    <path d="M72 620h1056l-16 12H88Z" fill="#e2e5e9" opacity=".72"/>
    <path d="M517 620h166c-2 11-12 17-25 17H542c-13 0-23-6-25-17Z" fill="#5e636a" opacity=".72"/>
    <path d="M183 685h834c-15 6-45 9-78 9H261c-33 0-63-3-78-9Z" fill="#17191d"/>
  </g>
</svg>
