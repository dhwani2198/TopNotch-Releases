      <g transform="translate(593 480)"><path d="M0 0h13v18H0z" fill="#f6b900"/><path d="M13 5l11-5v18l-11-5z" fill="#20b95b"/><path d="M0 0l8 5-8 5z" fill="#e94335"/></g>
      <text x="625" y="499" fill="#fff" font-size="18" font-weight="700">Join</text>
