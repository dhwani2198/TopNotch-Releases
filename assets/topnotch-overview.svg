      <text x="788" y="537">S</text><text x="814" y="537">M</text><text x="840" y="537">T</text><text x="866" y="537">W</text><text x="892" y="537">T</text><text x="918" y="537">F</text><text x="944" y="537">S</text>
      <text x="788" y="565">7</text><text x="814" y="565">8</text><text x="840" y="565">9</text><text x="866" y="565">10</text><text x="892" y="565">11</text><text x="918" y="565">12</text><text x="944" y="565">13</text>
      <text x="788" y="593">14</text><text x="814" y="593">15</text><text x="840" y="593">16</text><text x="866" y="593">17</text><text x="892" y="593">18</text><text x="918" y="593">19</text><text x="944" y="593">20</text>
      <text x="788" y="621">21</text><text x="814" y="621">22</text><text x="840" y="621">23</text><text x="866" y="621">24</text><text x="892" y="621">25</text><text x="918" y="621">26</text><text x="944" y="621">27</text>
    </g>
    <circle cx="788" cy="561" r="14" fill="#168ff4"/><text x="788" y="566" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">7</text>

    <rect x="970" y="468" width="196" height="200" rx="26" fill="#101010"/>
    <text x="992" y="502" fill="#fff" font-size="15" font-weight="750">MIRROR</text>
    <circle cx="1068" cy="555" r="22" fill="none" stroke="#fff" stroke-width="2"/><circle cx="1068" cy="549" r="7" fill="#fff"/><path d="M1055 568c4-10 22-10 26 0" fill="#fff"/>
    <text x="1014" y="608" fill="#fff" font-size="16" font-weight="700">Turn mirror on</text>

    <rect x="34" y="686" width="125" height="50" rx="15" fill="#242426"/><text x="61" y="718" fill="#fff" font-size="17" font-weight="700">▣  Join</text>
    <rect x="171" y="686" width="148" height="50" rx="15" fill="#242426"/><text x="194" y="718" fill="#fff" font-size="17" font-weight="700">▦  Schedule</text>
    <rect x="1114" y="686" width="52" height="50" rx="15" fill="#242426"/><text x="1131" y="719" fill="#fff" font-size="24">↻</text>
