    <text x="60" y="116" fill="#8d8d93" font-size="16" font-weight="700" letter-spacing="1">YOUR DAY</text>
    <text x="60" y="151" fill="#fff" font-size="29" font-weight="700">Monday, Sep 7</text>
    <text x="603" y="139" fill="#fff" font-size="17" font-weight="650">‹</text>
    <text x="634" y="139" fill="#fff" font-size="17" font-weight="650">Today</text>
    <text x="698" y="139" fill="#fff" font-size="17" font-weight="650">›</text>

    <text x="60" y="188" fill="#85858b" font-size="14" font-weight="700" letter-spacing=".8">▣  MEETINGS  3</text>
    <line x1="190" y1="183" x2="708" y2="183" stroke="#29292b"/>

    <g>
      <rect x="58" y="204" width="650" height="104" rx="18" fill="#1a1a1b"/>
      <rect x="74" y="220" width="6" height="72" rx="3" fill="#a9dced"/>
      <text x="98" y="244" fill="#fff" font-size="20" font-weight="700">Product sync</text>
      <text x="98" y="273" fill="#a3a3a8" font-size="16" font-weight="600">9:30 AM – 10:00 AM · Work Calendar</text>
