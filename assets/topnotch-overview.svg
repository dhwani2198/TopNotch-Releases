<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TopNotch day view</title>
  <desc id="desc">Vector mock-up of TopNotch showing calendar meetings, Prompter, mini calendar, and mirror.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#0987f5"/><stop offset="1" stop-color="#2f78e8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="760" rx="36" fill="#050505" filter="url(#shadow)"/>
  <path d="M460 0h280v26c0 18-15 32-33 32H493c-18 0-33-14-33-32V0Z" fill="#000"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
