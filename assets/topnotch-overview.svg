      <g transform="translate(593 244)"><path d="M0 0h13v18H0z" fill="#f6b900"/><path d="M13 5l11-5v18l-11-5z" fill="#20b95b"/><path d="M0 0l8 5-8 5z" fill="#e94335"/></g>
      <text x="625" y="263" fill="#fff" font-size="18" font-weight="700">Join</text>
    </g>

    <g>
      <rect x="58" y="322" width="650" height="104" rx="18" fill="#1a1a1b"/>
      <rect x="74" y="338" width="6" height="72" rx="3" fill="#a9dced"/>
      <text x="98" y="362" fill="#fff" font-size="20" font-weight="700">Design review</text>
      <text x="98" y="391" fill="#a3a3a8" font-size="16" font-weight="600">11:00 AM – 11:30 AM · Work Calendar</text>
