    <text x="780" y="420" fill="#8f8f94" font-size="14" font-weight="600">7 saved prompts</text>
    <text x="1078" y="420" fill="#fff" font-size="15" font-weight="700">New</text>
    <text x="1115" y="420" fill="#168ff4" font-size="15" font-weight="700">Save</text>

    <rect x="758" y="468" width="196" height="200" rx="26" fill="#101010"/>
    <text x="780" y="502" fill="#fff" font-size="16" font-weight="700">Sep</text>
