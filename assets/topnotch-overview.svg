      <rect x="74" y="456" width="6" height="72" rx="3" fill="#a9dced"/>
      <text x="98" y="480" fill="#fff" font-size="20" font-weight="700">Team check-in</text>
      <text x="98" y="509" fill="#a3a3a8" font-size="16" font-weight="600">1:00 PM – 1:30 PM · Work Calendar</text>
